[project]
name = "pync-cloudlab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "geni-lib @ git+https://gitlab.flux.utah.edu/emulab/geni-lib.git@c49e33287997878262c528ca7d2c08c31f64cb69",
  "six==1.17.0",
]

[dependency-groups]
dev = [
  "autopep8==2.3.2",
  "flake8==7.3.0",
  "flake8-bugbear==26.9.30",
  "flake8-isort==7.0.0",
  "pre-commit==4.5.1",
  "ty==0.0.86",
  "vermin==1.6.0",
]

[tool.autopep8]
max_line_length = 88
ignore = ["E501"]

[tool.isort]
py_version = 27
line_length = 88
