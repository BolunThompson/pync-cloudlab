[project]
name = "pync-cloudlab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "geni-lib @ git+https://gitlab.flux.utah.edu/emulab/geni-lib.git@c49e33287997878262c528ca7d2c08c31f64cb69",
  "six==1.17.0",
]

[dependency-groups]
dev = [
  "pre-commit==4.5.1",
  "ruff==0.17.0",
  "ty==0.0.86",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
