repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: autopep8
        name: autopep8
        entry: uv run --locked autopep8 --in-place
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: uv run --locked flake8
        language: system
        types: [python]
      - id: python-compatibility
        name: CloudLab Python 2.7 compatibility
        entry: uv run --locked vermin -t=2.7- --violations --no-tips
        language: system
        files: ^profile\.py$
      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x, --source-path=SCRIPTDIR:.]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-w, -i, '2']
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
